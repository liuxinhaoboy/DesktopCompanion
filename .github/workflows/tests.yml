name: Tests

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression suites
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $suites = @(
            "pse", "acl", "config", "characters", "settings", "voice",
            "hands", "browser_protocol", "model3d", "circadian", "shop"
          )
          foreach ($suite in $suites) {
            Write-Host "`n=== test_$suite ==="
            python "tests/test_$suite.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Smoke test first-run startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:DC_SMOKE_TEST = "3"
          $output = python main.py
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -notmatch "SMOKE_OK") {
            Write-Error "First-run startup did not print SMOKE_OK."
            exit 1
          }
